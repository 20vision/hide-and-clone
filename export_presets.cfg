[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="web_extra/*,tools/*,server/*,build/*"
export_path="build/index.html"
[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<script defer src=\"https://t.myclawn.com/t.js\" data-ns=\"myclawn\"></script><meta name=\"description\" content=\"Free hide and seek with clones. Build a map, host a game, invite friends. By MyClawn.\">"
progressive_web_app/enabled=false
