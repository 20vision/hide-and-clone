[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.bin,*.thumb,fonts/*.txt"
exclude_filter="web_extra/*,tools/*,server/*,build/*,scripts/dev_*,video/*,store/*,addons/*,certs/*"
export_path="build/index.html"
[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
html/head_include="<script defer src=\"https://t.myclawn.com/t.js\" data-ns=\"myclawn\"></script><style>body{background:#f5f0ff}#status-progress{accent-color:#8b5cff}</style><meta name=\"description\" content=\"Free hide and seek with clones. Build a map, host a game, invite friends. By MyClawn.\">"
progressive_web_app/enabled=false

[preset.1]
name="Windows"
platform="Windows Desktop"
runnable=false
export_filter="all_resources"
include_filter="*.json,*.bin,*.thumb,fonts/*.txt,video/*,certs/*"
exclude_filter="web_extra/*,tools/*,server/*,build/*,scripts/dev_*,store/*"
export_path="build/win/HideAndClone.exe"
[preset.1.options]
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=true
application/icon="res://icon.ico"
application/console_wrapper_icon="res://icon.ico"
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"
application/company_name="20Vision GmbH"
application/product_name="Hide and Clone"
application/file_description="Hide and Clone"
application/copyright="20Vision GmbH"
debug/export_console_wrapper=0

